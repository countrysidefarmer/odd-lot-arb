name: Update Historical Results

on:
  workflow_dispatch:   # run manually from GitHub UI whenever you want to add recent results

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run incremental backtest
        run: python backtest.py --incremental

      - name: Commit updated historical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historical.json
          git diff --cached --quiet || git commit -m "chore: update historical results $(date -u +%Y-%m-%d)"
          git push
