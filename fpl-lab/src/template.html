<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fielden FPL Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --ground:      #f4f6f8;
  --surface:     #ffffff;
  --surface-2:   #eef1f5;
  --line:        #dbe1e9;
  --line-strong: #c3ccd8;
  --ink:         #111823;
  --ink-2:       #45505f;
  --ink-3:       #6f7c8c;
  --accent:      #8e2f45;
  --accent-soft: #f6e8ec;
  /* Difficulty: one hue, light (easy) to dark (hard). Never colour alone. */
  --d1: #cde2fb; --d2: #9ec5f4; --d3: #5598e7; --d4: #256abf; --d5: #104281;
  --d1-ink: #0d366b; --d2-ink: #0d366b; --d3-ink: #ffffff; --d4-ink: #ffffff; --d5-ink: #ffffff;
  --good: #0ca30c; --warn: #fab219; --critical: #d03b3b;
  --good-bg: #e6f5e6; --warn-bg: #fdf3dd; --critical-bg: #fbe8e8;
  --shadow: 0 1px 2px rgba(17,24,35,.06), 0 4px 16px rgba(17,24,35,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:      #0e1319;
    --surface:     #161d26;
    --surface-2:   #1e2732;
    --line:        #2a3542;
    --line-strong: #3b4757;
    --ink:         #eef2f7;
    --ink-2:       #a9b5c3;
    --ink-3:       #7d8a99;
    --accent:      #e8798f;
    --accent-soft: #3a1d25;
    --d1: #0d366b; --d2: #184f95; --d3: #256abf; --d4: #5598e7; --d5: #9ec5f4;
    --d1-ink: #cde2fb; --d2-ink: #ffffff; --d3-ink: #ffffff; --d4-ink: #06203f; --d5-ink: #06203f;
    --good: #3ec93e; --warn: #fab219; --critical: #f26a6a;
    --good-bg: #122c12; --warn-bg: #33290c; --critical-bg: #3a1616;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:      #0e1319;
  --surface:     #161d26;
  --surface-2:   #1e2732;
  --line:        #2a3542;
  --line-strong: #3b4757;
  --ink:         #eef2f7;
  --ink-2:       #a9b5c3;
  --ink-3:       #7d8a99;
  --accent:      #e8798f;
  --accent-soft: #3a1d25;
  --d1: #0d366b; --d2: #184f95; --d3: #256abf; --d4: #5598e7; --d5: #9ec5f4;
  --d1-ink: #cde2fb; --d2-ink: #ffffff; --d3-ink: #ffffff; --d4-ink: #06203f; --d5-ink: #06203f;
  --good: #3ec93e; --warn: #fab219; --critical: #f26a6a;
  --good-bg: #122c12; --warn-bg: #33290c; --critical-bg: #3a1616;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 20px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: "Public Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 {
  font-family: Archivo, ui-sans-serif, system-ui, sans-serif;
  font-weight: 700;
  letter-spacing: -.018em;
  text-wrap: balance;
  margin: 0;
}
.mono, td.num, th.num, .chip, .eyebrow {
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-variant-numeric: tabular-nums;
}
.eyebrow {
  font-size: 11px; text-transform: uppercase; letter-spacing: .14em;
  color: var(--accent); font-weight: 600;
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* ---------------------------------------------------------------- chrome */
header {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.bar {
  max-width: 1440px; margin: 0 auto; padding: 14px 24px 0;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px;
}
.wordmark { font-family: Archivo; font-weight: 800; font-size: 19px; letter-spacing: -.03em; }
.wordmark span { color: var(--accent); }
.bar .meta { margin-left: auto; font-size: 12px; color: var(--ink-3); }
nav {
  max-width: 1440px; margin: 0 auto; padding: 0 24px;
  display: flex; gap: 2px; overflow-x: auto;
}
nav button {
  appearance: none; border: 0; background: none; cursor: pointer;
  font-family: Archivo; font-weight: 600; font-size: 14px;
  color: var(--ink-3); padding: 12px 14px; white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
nav button:hover { color: var(--ink); }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { max-width: 1440px; margin: 0 auto; padding: 24px 24px 80px; }
.panel[hidden] { display: none; }
section { margin-bottom: 34px; }
section > h2 { font-size: 20px; margin-bottom: 4px; }
section > .sub { color: var(--ink-2); font-size: 14px; margin: 0 0 16px; max-width: 68ch; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow);
}
.pad { padding: 18px 20px; }

/* --------------------------------------------------------------- summary */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 26px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); }
.stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); font-weight: 600; }
.stat .v { font-family: Archivo; font-weight: 700; font-size: 27px; letter-spacing: -.03em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .n { font-size: 12px; color: var(--ink-2); }

/* ---------------------------------------------------------------- tables */
.scroll { overflow-x: auto; border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead th {
  position: sticky; top: 0; background: var(--surface-2); z-index: 1;
  text-align: left; font-family: "IBM Plex Mono", monospace; font-weight: 600;
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2);
  padding: 9px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap;
}
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { color: var(--ink); }
thead th[aria-sort] { color: var(--accent); }
tbody td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:hover { background: var(--surface-2); }
td.num, th.num { text-align: right; }
.name { font-weight: 600; }
.tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-3); }
.pos { display: inline-block; min-width: 30px; font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 600; color: var(--ink-2); }
.big { font-family: Archivo; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ difficulty */
.fx { display: flex; gap: 2px; }
.fx i {
  font-style: normal; font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
  min-width: 46px; padding: 3px 4px; border-radius: 3px; text-align: center;
  letter-spacing: .01em; white-space: nowrap;
}
.d1 { background: var(--d1); color: var(--d1-ink); }
.d2 { background: var(--d2); color: var(--d2-ink); }
.d3 { background: var(--d3); color: var(--d3-ink); }
.d4 { background: var(--d4); color: var(--d4-ink); }
.d5 { background: var(--d5); color: var(--d5-ink); }
.legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.legend .fx i { min-width: 34px; }

/* ------------------------------------------------------------------ chips */
.chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600;
  padding: 2px 7px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap;
}
.chip.ok { background: var(--good-bg); color: var(--good); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.chip.warn { background: var(--warn-bg); color: color-mix(in srgb, var(--warn) 75%, var(--ink)); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.chip.bad { background: var(--critical-bg); color: var(--critical); border-color: color-mix(in srgb, var(--critical) 35%, transparent); }
.chip.flat { background: var(--surface-2); color: var(--ink-2); border-color: var(--line); }
.chip.cap { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }

/* ---------------------------------------------------------------- filters */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.controls label { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
select, input[type="search"], input[type="number"] {
  font-family: "Public Sans", sans-serif; font-size: 13px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 7px; padding: 6px 9px;
}
input[type="range"] { accent-color: var(--accent); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button {
  appearance: none; border: 0; background: none; cursor: pointer; border-radius: 6px;
  font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600;
  color: var(--ink-2); padding: 5px 11px;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.chart { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 6px; box-shadow: var(--shadow); }
.chart figcaption { font-family: Archivo; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick, .chart .axis { fill: var(--ink-3); font-family: "IBM Plex Mono", monospace; font-size: 9px; }
.chart .market { stroke: var(--ink-3); stroke-width: 2; stroke-dasharray: 5 4; opacity: .7; }
.chart .dot { fill: var(--d4); stroke: var(--surface); stroke-width: 2; }
.chart .dot.hit { fill: var(--accent); }
.chart .lab { fill: var(--ink); font-family: "IBM Plex Mono", monospace; font-size: 9.5px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.legend .swatch { width: 11px; height: 11px; border-radius: 50%; background: var(--d4); display: inline-block; }
.legend .swatch.line { width: 18px; height: 0; border-radius: 0; border-top: 2px dashed var(--ink-3); align-self: center; }
/* ------------------------------------------------------------ detail card */
.plink { appearance: none; border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; text-align: left; border-bottom: 1px dotted var(--line-strong); }
.plink:hover { color: var(--accent); border-bottom-color: var(--accent); }
dialog#detail { width: min(940px, 94vw); max-height: 88vh; padding: 0; border: 1px solid var(--line-strong); border-radius: 14px; background: var(--surface); color: var(--ink); box-shadow: 0 24px 70px rgba(0,0,0,.35); overflow: hidden; }
dialog#detail::backdrop { background: rgba(6,10,16,.6); backdrop-filter: blur(3px); }
.dlg-close { margin: 0; display: flex; align-self: flex-start; }
.dlg-close button { appearance: none; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); width: 30px; height: 30px; border-radius: 50%; font-size: 19px; line-height: 1; cursor: pointer; }
.dlg-close button:hover { color: var(--ink); border-color: var(--line-strong); }
.dlg-head { display: flex; align-items: center; gap: 20px; padding: 20px 22px 16px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { font-size: 24px; margin-top: 2px; }
.dlg-stat { margin-left: auto; text-align: right; }
.dlg-stat .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); font-weight: 600; }
.dlg-stat .v { font-family: Archivo; font-weight: 700; font-size: 30px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.dlg-body { padding: 18px 22px 24px; overflow-y: auto; max-height: calc(88vh - 92px); display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px 26px; align-items: start; }
.dlg-body section.wide { grid-column: 1 / -1; }
.dlg-body h3 { font-size: 14px; margin-bottom: 6px; }
.dlg-body .note { margin: 0 0 10px; font-size: 13px; color: var(--ink-2); }
.barrow .fill.neg { background: var(--critical); }
table.mini td { padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
table.mini td.num { color: var(--ink); }
tr.now { background: color-mix(in srgb, var(--accent) 7%, transparent); }
tr.now td { border-bottom-color: color-mix(in srgb, var(--accent) 25%, transparent); }
.swap-alt { display: flex; align-items: center; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.swap-alt > .num { margin-left: auto; text-align: right; white-space: nowrap; display: flex; align-items: baseline; gap: 8px; }
.swap-alt .lose { color: var(--critical); font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; }
/* ------------------------------------------------------------------- misc */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
.note { font-size: 13px; color: var(--ink-2); }
.bars { display: grid; gap: 7px; }
.barrow { display: grid; grid-template-columns: minmax(120px, 1.4fr) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.barrow .track { display: block; background: var(--surface-2); border-radius: 3px; height: 9px; overflow: hidden; }
.barrow .fill { display: block; background: var(--d4); height: 100%; border-radius: 3px; }
.barrow .val { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-2); min-width: 48px; text-align: right; }
.finding { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; margin: 14px 0; }
.finding h4 { font-size: 15px; margin-bottom: 2px; }
.finding p { margin: 0; color: var(--ink-2); font-size: 14px; }
.empty { color: var(--ink-3); font-size: 14px; padding: 16px 0; }
ul.tight { margin: 8px 0; padding-left: 20px; }
ul.tight li { margin: 5px 0; color: var(--ink-2); font-size: 14px; }
.swap { display: grid; grid-template-columns: minmax(0, 290px) 34px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line); }
.swap .arrow { padding-top: 2px; }
.alts { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.alt { white-space: nowrap; }
.alt strong { color: var(--ink); font-weight: 600; }
.swap .arrow { color: var(--accent); font-weight: 700; font-family: Archivo; }
.swap .out .name { text-decoration: line-through; text-decoration-color: var(--ink-3); }
.gain { font-family: Archivo; font-weight: 700; color: var(--good); font-variant-numeric: tabular-nums; }
td.gain { font-family: "IBM Plex Mono", monospace; font-weight: 600; }
td.lose { color: var(--critical); font-weight: 600; }
td.flat { color: var(--ink-3); }
@media (max-width: 640px) {
  main { padding: 18px 14px 60px; }
  .bar, nav { padding-left: 14px; padding-right: 14px; }
  .swap { grid-template-columns: 1fr; }
  .swap .arrow { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  <div class="bar">
    <div class="wordmark">FPL <span>Lab</span></div>

<script id="payload" type="application/json">"__DATA__"</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('payload').textContent);
const POS = { 1: 'GKP', 2: 'DEF', 3: 'MID', 4: 'FWD' };
const byId = new Map(D.players.map(p => [p.i, p]));
const fmt = (v, n = 1) => (v == null ? '–' : Number(v).toFixed(n));
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Horizon in gameweeks, shared across the whole page.
let H = 5;
const xp = p => (H === 1 ? p.x1 : H === 3 ? p.x3 : H === 5 ? p.x5 : p.x10);
const perGw = p => xp(p) / H;
// How much of the projection comes from the fixture run rather than the player.
const swing = p => (H === 1 ? p.sw3 / 3 : H === 3 ? p.sw3 : H === 5 ? p.sw5 : p.sw10);
const swingCell = p => {
  const v = swing(p);
  const cls = v > 0.4 ? 'gain' : v < -0.4 ? 'lose' : 'flat';
  return `<td class="num mono ${cls}">${v >= 0 ? '+' : ''}${fmt(v, 1)}</td>`;
};

/* ----------------------------------------------------------- shared bits */
function availChip(p) {
  if (p.st === 'a' && (p.ch == null || p.ch === 100)) {
    if (p.ps >= 0.8) return '<span class="chip ok">Nailed</span>';
    if (p.ps >= 0.55) return '<span class="chip flat">Rotates</span>';
    return '<span class="chip warn">Bench risk</span>';
  }
  if (p.st === 'd') return `<span class="chip warn">Doubt ${p.ch != null ? p.ch + '%' : ''}</span>`;
  if (p.st === 'i') return '<span class="chip bad">Injured</span>';
  if (p.st === 's') return '<span class="chip bad">Suspended</span>';
  return '<span class="chip bad">Unavailable</span>';
}
// Difficulty shading comes from the model's own expected goals, not the FPL
// difficulty rating — and from the side of the ball the player actually scores on.
// Defenders and keepers are shaded by goals conceded, attackers by goals scored.
function bucketGA(xga) { return xga <= 0.85 ? 1 : xga <= 1.10 ? 2 : xga <= 1.35 ? 3 : xga <= 1.65 ? 4 : 5; }
function bucketGF(xgf) { return xgf >= 1.90 ? 1 : xgf >= 1.60 ? 2 : xgf >= 1.35 ? 3 : xgf >= 1.10 ? 4 : 5; }

function fxStrip(p, n = 5) {
  const def = p.po === 1 || p.po === 2;
  return '<div class="fx">' + p.f.slice(0, n).map(f => {
    const b = def ? bucketGA(f.a) : bucketGF(f.s);
    const why = def ? `expected to concede ${fmt(f.a, 2)}` : `expected to score ${fmt(f.s, 2)}`;
    return `<i class="d${b}" title="GW${f.g} ${f.h ? 'home' : 'away'} v ${esc(f.o)} — ${why}, projected ${fmt(f.x, 1)} pts">${esc(f.o)}${f.h ? '' : ' (a)'}</i>`;
  }).join('') + '</div>';
}
const difficultyLegend = `<div class="legend"><span>Fixture difficulty</span><div class="fx">
  <i class="d1">1</i><i class="d2">2</i><i class="d3">3</i><i class="d4">4</i><i class="d5">5</i></div>
  <span>easiest to hardest, from the model's expected goals &middot; shaded on conceding for keepers and defenders,
  on scoring for midfielders and forwards &middot; the opponent is always named, so colour is never the only cue</span></div>`;

/* --------------------------------------------------------- player detail */
const PART_LABEL = {
  appearance: 'Appearance', goals: 'Goals', assists: 'Assists', cleanSheet: 'Clean sheet',
  defcon: 'Defensive contribution', bonus: 'Bonus', cards: 'Cards', conceding: 'Goals conceded', saves: 'Saves',
};

function pctBar(v, label) {
  return `<div class="barrow"><span>${esc(label)}</span>
    <span class="track"><span class="fill" style="width:${Math.max(1, v * 100)}%"></span></span>
    <span class="val">${Math.round(v * 100)}%</span></div>`;
}

function openPlayer(id) {
  const p = byId.get(id);
  if (!p) return;
  const dlg = document.getElementById('detail');
  const det = p.f.filter(f => f.pt);
  const total = det.reduce((s, f) => s + f.x, 0);

  // Points split across the detailed fixtures, largest contributor first.
  const agg = {};

/* -------------------------------------------------------------- my squad */
function bestXI(squad) {
  // Highest projected XI that satisfies 1 GK / 3+ DEF / 1+ FWD.
  const gk = squad.filter(p => p.po === 1).sort((a, b) => xp(b) - xp(a));
  const df = squad.filter(p => p.po === 2).sort((a, b) => xp(b) - xp(a));
  const md = squad.filter(p => p.po === 3).sort((a, b) => xp(b) - xp(a));
  const fw = squad.filter(p => p.po === 4).sort((a, b) => xp(b) - xp(a));
  let best = null;
  for (let d = 3; d <= 5; d++) for (let m = 2; m <= 5; m++) {
    const f = 10 - d - m;
    if (f < 1 || f > 3 || d > df.length || m > md.length || f > fw.length) continue;
    const xi = [gk[0], ...df.slice(0, d), ...md.slice(0, m), ...fw.slice(0, f)].filter(Boolean);
    if (xi.length !== 11) continue;
    const total = xi.reduce((s, p) => s + xp(p), 0);
    if (!best || total > best.total) best = { total, xi, shape: `${d}-${m}-${f}` };
  }
  return best;
}

let squadSort = { key: 'xp', dir: -1 };
const SORTERS = {
  pos: p => p.po, name: p => p.n.toLowerCase(), cost: p => p.c,
  mins: p => p.em, xp: p => xp(p), gw: p => perGw(p), own: p => p.o,
};
function sortSquad(list) {
  const f = SORTERS[squadSort.key] || SORTERS.xp;
  return list.slice().sort((a, b) => {
    const x = f(a), y = f(b);
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * squadSort.dir;
  });
}
function sortableHead(cols) {
  return cols.map(c => {
    const on = squadSort.key === c.key;
    const aria = on ? (squadSort.dir === 1 ? 'ascending' : 'descending') : null;
    const arrow = on ? (squadSort.dir === 1 ? ' &uarr;' : ' &darr;') : '';
    return '<th class="' + (c.num ? 'num ' : '') + 'sortable" data-sort="' + c.key + '"'
      + (aria ? ' aria-sort="' + aria + '"' : '') + '>' + c.label + arrow + '</th>';
  }).join('');
}

// Team selection for one specific gameweek: who starts, who is captain, bench order.
function gwPoints(p, gw) {
  const f = p.f.find(x => x.g === gw);
  return f ? f.x : 0;
}

function bestXIforGw(squad, gw) {
  const score = p => gwPoints(p, gw);
  const bucket = n => squad.filter(p => p.po === n).sort((a, b) => score(b) - score(a));
  const gk = bucket(1), df = bucket(2), md = bucket(3), fw = bucket(4);
  let best = null;
  for (let d = 3; d <= 5; d++) for (let m = 2; m <= 5; m++) {
    const f = 10 - d - m;
    if (f < 1 || f > 3 || d > df.length || m > md.length || f > fw.length || !gk.length) continue;
    const xi = [gk[0], ...df.slice(0, d), ...md.slice(0, m), ...fw.slice(0, f)];
    if (xi.length !== 11) continue;
    const total = xi.reduce((s, p) => s + score(p), 0);
    if (!best || total > best.total) best = { total, xi, shape: `${d}-${m}-${f}` };
  }
  return best;
}

          <strong>${fmt((gwPoints(cap, gw) - gwPoints(ranked[2], gw)) * 2, 1)}</strong> points on average — real, but smaller than
          most people assume. One gameweek is mostly noise.</p>

/* ------------------------------------------------------------------ plan */
function renderPlan() {
  const root = document.getElementById('p-plan');
  const P = D.plan;
  if (!P || !P.best) {
    root.innerHTML = '<p class="empty">No plan yet — run <span class="mono">npm run plan</span>.</p>';
    return;
  }
  const gws = P.horizon;
  const weeks = P.best.weeks;
  const first = weeks[0];
  const perGw = P.best.points / weeks.length;

  const swapLine = t => `<span class="name">${esc(t.out.name)}</span> <span class="tag">${esc(t.out.team)} £${fmt(t.out.cost, 1)}m</span>
    <span class="arrow">&rarr;</span> <span class="name">${esc(t.in.name)}</span> <span class="tag">${esc(t.in.team)} £${fmt(t.in.cost, 1)}m</span>`;

  root.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Plan, GW${gws[0]}&ndash;${gws[gws.length - 1]}</div><div class="v">${fmt(P.best.points, 0)}</div>
        <div class="n">${fmt(perGw, 1)} points a gameweek</div></div>
      <div class="stat"><div class="k">Versus holding</div><div class="v">+${fmt(P.best.gain, 0)}</div>
        <div class="n">doing nothing scores ${fmt(P.noTransferPoints, 0)}</div></div>
      <div class="stat"><div class="k">Hits taken</div><div class="v">${P.best.hits}</div>
        <div class="n">${P.best.hits ? `costing ${P.best.hits * 4} points, already netted off` : 'no points spent on extra transfers'}</div></div>
      <div class="stat"><div class="k">Do this week</div><div class="v">${first.transfers.length ? esc(first.transfers[0].in.name) : 'Roll'}</div>
        <div class="n">${first.transfers.length ? `${first.transfers.length} transfer${first.transfers.length > 1 ? 's' : ''} in GW${first.gw}` : 'bank the transfer'}</div></div>
    </div>

    <section>
      <h2>The plan</h2>
      <p class="sub">A search over sequences of transfers across the next ${weeks.length} gameweeks, rather than the best move
        this week in isolation. It respects your bank, the three-per-club rule, one free transfer a week, and charges 4 points
        for every extra. Only the first week is a decision you have to make now — the rest is the reasoning behind it.</p>
      <div class="card scroll"><table>
        <thead><tr><th>GW</th><th>Move</th><th>Captain</th><th class="num">Hit</th><th class="num">Projected</th></tr></thead>
        <tbody>${weeks.map((w, i) => `<tr${i === 0 ? ' class="now"' : ''}>
          <td class="mono">${w.gw}${i === 0 ? ' <span class="chip cap">now</span>' : ''}</td>
          <td>${w.transfers.length ? w.transfers.map(swapLine).join('<br>') : '<span class="tag">roll the transfer</span>'}</td>
          <td>${esc(w.captain.name)} <span class="tag">${esc(w.captain.team)}</span></td>
          <td class="num mono">${w.hit ? '&minus;' + w.hit : '&ndash;'}</td>
          <td class="num big">${fmt(w.pts, 1)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </section>

    ${P.alternatives && P.alternatives.length ? `<section>
      <h2>If you would rather do something else</h2>
      <p class="sub">Different opening moves, each followed by its own best continuation, and what the whole horizon costs
        you for choosing it. A gap of a point or two is inside the model's noise — treat those as equivalent and pick on
        what you know that it does not.</p>
      <div class="card pad">${P.alternatives.map(a => `<div class="swap-alt">
        <div>${a.opening.length ? a.opening.map(swapLine).join('<br>') : '<span class="tag">roll the transfer</span>'}</div>
        <div class="num"><span class="big">${fmt(a.points, 1)}</span>
          <span class="${a.cost > 2 ? 'lose' : 'tag'}">&minus;${fmt(a.cost, 1)}</span></div>
      </div>`).join('')}</div>
    </section>` : ''}

    <section>
      <h2>What this is and is not</h2>
      <div class="card pad">
        <ul class="tight">
          <li>The <strong>+${fmt(P.best.gain, 0)} point gain is measured against the model's own projections</strong>, not against
            reality. It is the gain if the projections are right, and they carry a mean absolute error of about 2.4 points per
            player per gameweek. Read it as a ranking of plans, not a forecast of your score.</li>
          <li>Only <strong>gameweek ${first.gw} is a decision</strong>. Everything after it will be re-planned next week with better
            information, and almost certainly will change.</li>
          <li>Selling prices are assumed equal to current prices. If you have held a player through a rise, you may have
            slightly more money than this thinks.</li>
          <li>Chips are not planned. Blanks and doubles are not modelled.</li>
        </ul>
      </div>
    </section>`;
}

/* ------------------------------------------------------------- transfers */
function renderTransfers() {
  const squad = D.squad.map(s => byId.get(s.id)).filter(Boolean);
  const root = document.getElementById('p-transfers');
  if (!squad.length) { root.innerHTML = '<p class="empty">No squad published yet.</p>'; return; }
  const owned = new Set(squad.map(p => p.i));
  const clubCount = {};
  squad.forEach(p => { clubCount[p.t] = (clubCount[p.t] || 0) + 1; });
  const bank = D.entry.bank;
  const maxOwn = +document.getElementById('ownFilter')?.value || 100;

  // One row per player you could sell, showing the best replacement plus runner-ups —
  // ranking raw pairs just lists every possible partner for your two worst players.
  const moves = [];
  for (const out of squad) {
    const options = [];
    for (const inp of D.players) {
      if (owned.has(inp.i) || inp.po !== out.po) continue;
      if (inp.c > out.c + bank) continue;
      if (inp.o > maxOwn) continue;
      // Three-per-club rule, accounting for the player leaving.
      if ((clubCount[inp.t] || 0) - (out.t === inp.t ? 1 : 0) >= 3) continue;
      const gain = xp(inp) - xp(out);
      if (gain <= 0) continue;
      options.push({ inp, gain, spend: inp.c - out.c });
    }
    if (!options.length) continue;
    options.sort((a, b) => b.gain - a.gain);
    moves.push({ out, ...options[0], alts: options.slice(1, 4) });
  }
  moves.sort((a, b) => b.gain - a.gain);
  const top = moves;

  root.innerHTML = `${horizonBar()}
    <section>
      <h2>Single transfers, ranked</h2>
      <p class="sub">Every legal one-for-one move — budget, squad value and the three-per-club rule all respected —
        sorted by the points it adds over the next ${H} gameweek${H > 1 ? 's' : ''}. A hit costs 4, so anything under that gain is not worth taking early.
        Each row is an independent option priced against your current bank — the same replacement can be the best answer to several of your players,
        so read this as a menu, not a plan.</p>
      <div class="controls">
        <label>Max ownership
          <input type="number" id="ownFilter" value="${maxOwn}" min="0" max="100" step="5" style="width:70px">%
        </label>
        <span class="note">Lower it to hunt differentials.</span>
      </div>
      <div class="card pad">
        ${top.length ? top.map(m => `<div class="swap">
          <div class="out">${pname(m.out)} <span class="tag">${esc(m.out.ts)} · £${fmt(m.out.c, 1)}m</span>
            <div class="note">${fmt(xp(m.out), 1)} pts · ${Math.round(m.out.em)} mins/gw</div></div>
          <div class="arrow">&rarr;</div>
          <div class="in">${pname(m.inp)} <span class="tag">${esc(m.inp.ts)} · £${fmt(m.inp.c, 1)}m · ${fmt(m.inp.o, 1)}% owned</span>
            <div class="note">${fmt(xp(m.inp), 1)} pts · ${Math.round(m.inp.em)} mins/gw · <span class="gain">+${fmt(m.gain, 1)}</span>
              ${m.spend > 0 ? `· costs £${fmt(m.spend, 1)}m` : m.spend < 0 ? `· frees £${fmt(-m.spend, 1)}m` : ''}</div>
            ${fxStrip(m.inp, 5)}
            ${m.alts.length ? `<div class="note alts">Also worth a look:
              ${m.alts.map(a => `<span class="alt"><strong>${esc(a.inp.n)}</strong> ${esc(a.inp.ts)} £${fmt(a.inp.c, 1)}m <span class="gain">+${fmt(a.gain, 1)}</span></span>`).join('')}</div>` : ''}
          </div>
        </div>`).join('') : '<p class="empty">No move improves the squad at this horizon — hold your transfer.</p>'}
      </div>
    </section>
    <section>${difficultyLegend}</section>`;
  const own = document.getElementById('ownFilter');
  if (own) own.addEventListener('change', renderTransfers);
}

// Where the value is: within a position, fit projected points against price and
// rank players by how far they sit above that market line. Comparing across
// positions is meaningless — a 4.5m defender and a 14m forward are different jobs.
function marketFit(list) {
  const n = list.length;
  if (n < 4) return { a: 0, b: 0 };
  const mx = list.reduce((s, p) => s + p.c, 0) / n;
  const my = list.reduce((s, p) => s + xp(p), 0) / n;
  let sxy = 0, sxx = 0;
  for (const p of list) { sxy += (p.c - mx) * (xp(p) - my); sxx += (p.c - mx) ** 2; }
  const b = sxx ? sxy / sxx : 0;
  return { a: my - b * mx, b };
}

function scatter(list, fit, title) {
  const W = 360, Hh = 240, m = { t: 14, r: 14, b: 34, l: 38 };
  const xs = list.map(p => p.c), ys = list.map(p => xp(p));
  const x0 = Math.min(...xs) - 0.3, x1 = Math.max(...xs) + 0.3;
  const y0 = 0, y1 = Math.max(...ys) * 1.12 || 1;
  const px = v => m.l + ((v - x0) / (x1 - x0)) * (W - m.l - m.r);
  const py = v => Hh - m.b - ((v - y0) / (y1 - y0)) * (Hh - m.t - m.b);
  const ranked = list.map(p => ({ p, res: xp(p) - (fit.a + fit.b * p.c) }))
    .sort((a, b) => b.res - a.res);
  const labelled = new Set(ranked.slice(0, 3).map(r => r.p.i));
  const xticks = [], step = (x1 - x0) > 8 ? 2 : 1;
  for (let v = Math.ceil(x0); v <= x1; v += step) xticks.push(v);
  const yticks = [0, y1 / 2, y1].map(v => Math.round(v));

  return `<figure class="chart">
    <figcaption>${esc(title)}</figcaption>
    <svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(title)}: projected points against price">
      ${yticks.map(v => `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${py(v)}" y2="${py(v)}"/>
        <text class="tick" x="${m.l - 6}" y="${py(v) + 3.5}" text-anchor="end">${v}</text>`).join('')}
      ${xticks.map(v => `<text class="tick" x="${px(v)}" y="${Hh - m.b + 15}" text-anchor="middle">${v}</text>`).join('')}
      <line class="market" x1="${px(x0)}" y1="${py(Math.max(0, fit.a + fit.b * x0))}"
            x2="${px(x1)}" y2="${py(Math.max(0, fit.a + fit.b * x1))}"/>
      ${list.map(p => {
        const on = labelled.has(p.i);
        return `<circle class="dot${on ? ' hit' : ''}" cx="${px(p.c).toFixed(1)}" cy="${py(xp(p)).toFixed(1)}" r="${on ? 5 : 3.6}">
          <title>${esc(p.n)} (${esc(p.ts)}) — £${fmt(p.c, 1)}m, ${fmt(xp(p), 1)} projected points over ${H} GW, ${Math.round(p.em)} mins</title>
        </circle>`;
      }).join('')}
      ${ranked.slice(0, 3).map(r => {
        const x = px(r.p.c), y = py(xp(r.p));
        const flip = x > W * 0.62;
        return `<text class="lab" x="${(flip ? x - 8 : x + 8).toFixed(1)}" y="${(y + 3.5).toFixed(1)}"
          text-anchor="${flip ? 'end' : 'start'}">${esc(r.p.n)}</text>`;
      }).join('')}
      <text class="axis" x="${(W + m.l - m.r) / 2}" y="${Hh - 3}" text-anchor="middle">Price (£m)</text>
    </svg>
  </figure>`;
}

function renderValue() {
  const root = document.getElementById('p-value');
  const owned = new Set(D.squad.map(s => s.id));
  const pool = D.players.filter(p => p.em >= 55);
  const groups = [[1, 'Goalkeepers'], [2, 'Defenders'], [3, 'Midfielders'], [4, 'Forwards']];

  const charts = groups.map(([pos, nm]) => {
    const list = pool.filter(p => p.po === pos);
    return list.length >= 4 ? scatter(list, marketFit(list), nm) : '';
  }).join('');

  const rows = [];
  for (const [pos, nm] of groups) {
    const list = pool.filter(p => p.po === pos);
    if (list.length < 4) continue;
    const fit = marketFit(list);
    list.map(p => ({ p, res: xp(p) - (fit.a + fit.b * p.c) }))
      .sort((a, b) => b.res - a.res).slice(0, 6)
      .forEach(r => rows.push({ ...r, nm }));
  }
  rows.sort((a, b) => b.res - a.res);

  root.innerHTML = `${horizonBar()}
    <section>
      <h2>Where the value is</h2>
      <p class="sub">Each panel fits a market line through that position — what the game charges for a projected point —
        and the players sitting furthest above it are underpriced for what the model expects them to deliver.
        Only players projected to play (55+ minutes a gameweek) are shown, because value you cannot field is not value.</p>
      <div class="charts">${charts}</div>
      <div class="legend" style="margin-top:10px">
        <span class="swatch"></span><span>One player</span>
        <span class="swatch line"></span><span>What the market charges at that price</span>
        <span>&middot; the three biggest bargains in each position are labelled</span>
      </div>
    </section>
    <section>
      <h2>Underpriced, ranked</h2>
      <p class="sub">Points above what the price implies, over the next ${H} gameweek${H > 1 ? 's' : ''}.
        Role notes flag the players whose projection rests on something other than a clean Premier League record —
        read those before you trust the number.</p>
      <div class="card scroll"><table>
        <thead><tr><th>Player</th><th class="num">£m</th><th class="num">xP${H}</th><th class="num">vs market</th>
          <th class="num">xGI/90</th><th class="num">Mins</th><th class="num">Own%</th><th>Role</th></tr></thead>
        <tbody>${rows.slice(0, 24).map(r => `<tr>
          <td><span class="pos">${POS[r.p.po]}</span> ${pname(r.p)}
            <span class="tag">${esc(r.p.ts)}</span>${owned.has(r.p.i) ? ' <span class="chip cap">Owned</span>' : ''}</td>
          <td class="num mono">${fmt(r.p.c, 1)}</td>
          <td class="num big">${fmt(xp(r.p), 1)}</td>
          <td class="num gain">+${fmt(r.res, 1)}</td>
          <td class="num mono">${fmt(r.p.xgi, 2)}</td>
          <td class="num mono">${Math.round(r.p.em)}'</td>
          <td class="num mono">${fmt(r.p.o, 1)}</td>
          <td>${roleChips(r.p)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </section>`;
}

function roleChips(p) {
  const out = [];
  if (p.pen === 1) out.push('<span class="chip flat">Penalties</span>');
  if (p.sp) out.push('<span class="chip flat">Set pieces</span>');
  (p.rn || []).forEach(n => {
    if (/penalty taker|Lost penalties|set-piece/i.test(n)) return;   // already chipped
    const bad = /No Premier League record/i.test(n);
    out.push(`<span class="chip ${p.ovr ? 'cap' : bad ? 'warn' : 'flat'}" title="${esc(n)}">${esc(n.length > 26 ? n.slice(0, 24) + '…' : n)}</span>`);
  });
  return out.join(' ') || '<span class="tag">–</span>';
}

/* -------------------------------------------------------------- research */
function bars(items, max) {
  const m = max || Math.max(...items.map(i => i.v), 0.001);
  return '<div class="bars">' + items.map(i => `<div class="barrow">
    <span>${esc(i.k)}</span>
    <span class="track"><span class="fill" style="width:${Math.max(1, (i.v / m) * 100)}%"></span></span>
    <span class="val">${i.label}</span></div>`).join('') + '</div>';
}

function renderResearch() {
  const root = document.getElementById('p-research');
  const seasons = Object.keys(D.research.seasons);
  const s0 = D.research.seasons[seasons[0]];
  const modelBars = (a) => bars(a.models.map(m => ({ k: m.name, v: m.r2, label: (m.r2 * 100).toFixed(1) + '%' })));
  const uniBars = (a) => bars(a.univariate.slice(0, 8).map(u => ({ k: u.label, v: Math.abs(u.rho), label: u.rho.toFixed(2) })));

  const posTable = seasons.map(sn => {
    const bp = D.research.seasons[sn].byPos;
    return `<h4 style="margin-top:18px">${sn}</h4>
      <div class="scroll"><table>
        <thead><tr><th>Position</th><th class="num">n</th><th class="num">Form alone</th><th class="num">Fixture alone</th>
          <th class="num">Underlying alone</th><th class="num">Fixture adds</th></tr></thead>
        <tbody>${Object.entries(bp).map(([pos, a]) => {
          const m = Object.fromEntries(a.models.map(x => [x.name, x.r2]));
          return `<tr><td class="name">${esc(pos)}</td><td class="num mono">${a.n}</td>
            <td class="num mono">${(m['Form only'] * 100).toFixed(1)}%</td>
            <td class="num mono">${(m['Fixture only'] * 100).toFixed(1)}%</td>
            <td class="num mono">${(m['Underlying rates only'] * 100).toFixed(1)}%</td>
            <td class="num big">+${(a.increment.fixtureGain * 100).toFixed(2)}pp</td></tr>`;
        }).join('')}</tbody></table></div>`;
  }).join('');

  root.innerHTML = `
    <section>
      <h2>Is it fixtures or form?</h2>
      <p class="sub">Rather than repeat the received wisdom, this tests it on ${(s0.rows + D.research.seasons[seasons[1]]?.rows || 0).toLocaleString()}
        player-gameweeks from the ${seasons.join(' and ')} seasons. Every predictor is built only from gameweeks before the one being predicted,
        so nothing here is hindsight. R² is the share of the variation in points a model explains — football is noisy, so even good models score low.</p>

      <div class="finding">
        <h4>Minutes are the whole ballgame</h4>
        <p>Across all players, expected minutes explain more than form, fixtures and underlying stats combined.
          Most FPL points are lost by owning someone who does not play, not by owning someone who plays badly.</p>
      </div>
      <div class="finding">
        <h4>Once a player is nailed, fixtures and form are roughly the same size — and both are small</h4>
        <p>Restrict to near-ever-present starters and minutes stop discriminating. Form edges fixtures,
          but the honest answer is that a single gameweek is close to a coin flip: the best model explains under 10% of it.</p>
      </div>
      <div class="finding">
        <h4>Fixtures matter for defenders. They barely matter for attackers</h4>
        <p>This is the finding worth acting on. For defenders the fixture run adds real predictive power in both seasons;
          for midfielders and forwards it adds almost nothing. Keepers swing hard between the two seasons, so treat that row as unsettled.
          Rotate your defence on the ticker; pick your midfielders and forwards on quality and ignore the colour of their next five.</p>
      </div>
      <div class="finding">
        <h4>Season-long quality beats four-game form</h4>
        <p>Over a five-gameweek horizon, points-per-game across the whole season predicts better than the last four games.
          Chasing a hot streak is usually chasing noise.</p>
      </div>
    </section>

    <section>
      <h2>Fixtures by position</h2>
      <p class="sub">Nailed starters only, predicting points over the next five gameweeks.
        The last column is the extra explanatory power the fixture run adds once minutes and form are already known.</p>
      <div class="card pad">${posTable}</div>
    </section>

    <section>
      <h2>Model comparison</h2>
      <p class="sub">Each bar is a model built from one family of predictors, scored on the same data.</p>
      <div class="grid2">
        ${seasons.map(sn => {
          const a = D.research.seasons[sn].nailed5;
          return `<div class="card pad"><div class="eyebrow">${esc(sn)} &middot; nailed starters, next 5 GW</div>
            <h3 style="margin:4px 0 14px;font-size:16px">Variance explained</h3>${modelBars(a)}</div>`;

        ${seasons.map(sn => {
          const m = D.signals.seasons[sn].minutes;
          return `<div class="card pad"><div class="eyebrow">${esc(sn)}</div>
            <h3 style="margin:4px 0 4px;font-size:16px">Predicting minutes</h3>
            <p class="note" style="margin:0 0 12px">Variance explained, next gameweek.</p>
            ${bars(m.models.map(x => ({ k: x.name, v: x.r2, label: (x.r2 * 100).toFixed(1) + '%' })))}</div>`;
        }).join('')}
        ${seasons.map(sn => {
          const q = D.signals.seasons[sn].quality;
          return `<div class="card pad"><div class="eyebrow">${esc(sn)} &middot; n=${q.n}</div>
            <h3 style="margin:4px 0 4px;font-size:16px">Points, given the player started</h3>
            <p class="note" style="margin:0 0 12px">Rank correlation. Everything together explains just
              <strong>${(q.r2 * 100).toFixed(1)}%</strong>.</p>
            ${bars(q.top.slice(0, 6).map(u => ({ k: u.label, v: Math.abs(u.rho), label: u.rho.toFixed(2) })))}</div>`;
        }).join('')}
      </div>
      <div class="finding" style="margin-top:20px">
        <h4>Minutes are an order of magnitude more predictable than points</h4>
        <p>Around ${(D.signals.seasons[seasons[0]].minutes.models[4].r2 * 100).toFixed(0)}% of the variation in next-week minutes
          can be explained, against ${(D.signals.seasons[seasons[0]].quality.r2 * 100).toFixed(1)}–${(D.signals.seasons[seasons[1]].quality.r2 * 100).toFixed(1)}%
          of the points a player scores once he is on the pitch. That asymmetry is the whole game:
          the winnable part of FPL is being right about who plays.</p>
      </div>
      <div class="finding">
        <h4>Recency beats averages</h4>
        <p>Minutes in the single most recent match predict next week better than a whole season's start rate.
          A player's last three games are worth more than his last thirty.</p>
      </div>
      <div class="finding">
        <h4>Underlying numbers do carry signal — it is just thin per game</h4>
        <p>Given a start, xG+xA per 90, ICT, bonus rate and penalty duty all rank above form. Each is a small edge
          in one gameweek, but unlike form they persist, so they compound across a five or ten week horizon.
          That is why this model projects off per-90 rates rather than recent points.</p>
      </div>
    </section>

    <section>
      <h2>The gameweek-1 problem</h2>
      <p class="sub">New signings, promoted squads, players in changed roles — the situation right now, with no
        current-season evidence for anyone. <span class="mono">src/preseason.js</span> tests it directly: predict
        the opening six gameweeks of a season using only what was knowable before it started.</p>
      <div class="grid2">
        <div class="card pad">
          <h3 style="margin:0 0 4px;font-size:16px">How well it can be done</h3>
          <p class="note" style="margin:0 0 12px">Predicting average minutes over gameweeks 1–6, n=${D.signals.preseason.n} players.</p>
          ${bars([
            { k: 'Last season start rate alone', v: D.signals.preseason.lastSeasonStartRate },
            { k: 'This season price alone', v: D.signals.preseason.priceAlone },
            { k: 'Last season minutes signals', v: D.signals.preseason.minutesSignals },
            { k: '+ price', v: D.signals.preseason.plusPrice },
            { k: '+ set-piece duty', v: D.signals.preseason.plusSetPiece },
            { k: 'Everything', v: D.signals.preseason.everything },
          ].map(x => ({ ...x, label: x.v.toFixed(1) + '%' })))}
          <p class="note" style="margin-top:12px">Against roughly 49% mid-season. Preseason is genuinely harder,
            and that gap is the uncertainty you are carrying right now.</p>
        </div>
        <div class="card pad">
          <h3 style="margin:0 0 4px;font-size:16px">Players with no Premier League record</h3>
          <p class="note" style="margin:0 0 12px">n=${D.signals.preseason.noHistoryN}. Price is almost the only signal,
            explaining ${D.signals.preseason.noHistoryPrice}% on its own and ${D.signals.preseason.noHistoryPriceDuty}% with set-piece duty added.
            This is what the model falls back on for promoted squads and overseas signings.</p>
          <div class="scroll"><table>
            <thead><tr><th>Price band</th><th class="num">Average minutes, GW1–6</th><th class="num">n</th></tr></thead>
            <tbody>${D.signals.preseason.bands.map(b => `<tr>
              <td class="mono">£${fmt(b.lo, 1)}–${fmt(b.hi, 1)}m</td>
              <td class="num big">${fmt(b.mins, 1)}</td>
              <td class="num mono">${b.n}</td></tr>`).join('')}</tbody>
          </table></div>
          <p class="note" style="margin-top:12px">An unknown player on set-piece duty averaged
            <strong>${fmt(D.signals.preseason.setPieceMins, 0)}</strong> minutes against
            <strong>${fmt(D.signals.preseason.noSetPieceMins, 0)}</strong> for the rest — being trusted with corners
            is a strong tell that a manager trusts you with a shirt.</p>
        </div>
      </div>
      <div class="finding" style="margin-top:20px">
        <h4>Penalty duty is a role signal, not a points bonus</h4>
        <p>Penalty takers vastly outscore everyone else, but their historical xG <em>already contains</em> the penalties —
          adding a bonus on top would double-count. Nor does it predict minutes independently once you know last season's:
          penalty takers were already established starters. Where it earns its place is when duty <em>changes hands</em>,
          or when there is no history to contain it. The model applies it only in those cases.</p>
      </div>
    </section>

    <section>
      <h2>How this changes what you do</h2>
      <div class="card pad">
        <ul class="tight">
          <li><strong>Never own a rotation risk to save money.</strong> The gap between a nailed £4.5m defender and a £5.5m one who plays two games in three is bigger than any fixture swing.</li>
          <li><strong>Buy attackers on underlying numbers, not on the ticker.</strong> xG and xA per 90 hold up; a green run of fixtures for a mediocre forward does not.</li>
          <li><strong>Buy and bench defenders on the ticker.</strong> This is where fixture-based rotation genuinely pays.</li>
          <li><strong>Do not take a hit on form.</strong> Four points is a large edge — the ranked transfer list shows you when a move actually clears it.</li>
          <li><strong>Captain the highest projection, not the best fixture.</strong> Captaincy is a minutes-and-quality decision.</li>
          <li><strong>Judge minutes on the last three games, not the season.</strong> Recency wins, and it is the one thing you can genuinely forecast.</li>
          <li><strong>Treat set-piece and penalty duty as evidence of a role</strong>, not as bonus points — the xG already counts the penalties.</li>
          <li><strong>Overrule the model on team news.</strong> It cannot read a press conference; you can. That is what <span class="mono">data/overrides.json</span> is for.</li>
        </ul>
      </div>
    </section>`;
}

/* ---------------------------------------------------------------- method */
function renderMethod() {
  document.getElementById('p-method').innerHTML = `
    <section>
      <h2>How the projections are built</h2>
      <p class="sub">Worth reading once, so you know when to trust the numbers and when to overrule them.</p>
      <div class="card pad">
        <h3 style="font-size:16px">The calculation</h3>
        <p class="note">For every player and every upcoming fixture: expected minutes, multiplied by per-90 scoring rates,
          multiplied by a fixture adjustment from the opponent's attacking and defensive strength and home advantage.
          That produces expected goals, assists, clean sheets, defensive contributions, saves, bonus and cards,
          which are converted to points using the scoring table for that position. Clean sheets use a Poisson probability
          on the goals the opponent is expected to score.</p>
        <h3 style="font-size:16px;margin-top:18px">Where the numbers come from</h3>
        <ul class="tight">
          <li>Live prices, ownership, injuries and availability from the official FPL API.</li>
          <li>Per-90 scoring rates from the ${esc(D.lastSeason)} season, blended into this season's data as it accumulates.</li>
          <li>Players with no Premier League history — new signings, promoted squads — fall back to a prior fitted on price and position, so they are never projected at zero.</li>
          <li>Expected goals per match come from <strong>Polymarket's betting markets</strong> where that fixture is priced — the market reprices on team news and transfers within minutes, which no season-average model can do. Each match's win/draw/loss prices are solved for the pair of Poisson means that reproduces them.</li>
          <li>Beyond the market's coverage — it lists only a gameweek or two ahead — team strength falls back to goals scored and conceded, with promoted clubs started below average.</li>
          <li>Expected minutes model the <em>distribution</em>, not an average: the rate at which a player appeared at all and cleared 60 minutes across his last 15 games, blended with this season. Appearance points turn on those two probabilities, so estimating them directly beats assuming them from an average.</li>
          <li>The run-in is weighted over the full season, because recency predicts better. Players with no Premier League record fall back to a price band measured from real gameweek 1-6 outcomes.</li>
          <li>Penalty and set-piece duty are compared against last season's. Where duty has changed hands, or where there is no history, expected goals are adjusted; otherwise they are left alone, because historical xG already contains them.</li>
        </ul>
        <h3 style="font-size:16px;margin-top:18px">Overriding it</h3>
        <p class="note">Edit <span class="mono">data/overrides.json</span> and re-run to set a player's start probability by hand,
          with a note explaining why. Use it for what the data cannot see: a returning injury, an understudy ruled out,
          a confirmed change of role. Overridden players are chipped as such on the value table. Delete the entry once the
          season's own data has caught up.</p>
        <h3 style="font-size:16px;margin-top:18px">Does it actually work?</h3>
        <p class="note">Replayed across gameweeks 9&ndash;38 of last season, rebuilding every input from matches already
          played &mdash; 11,812 player-gameweeks. Run it yourself with <span class="mono">npm run backtest</span>.</p>
        <div class="scroll"><table>
          <thead><tr><th>Mean absolute error</th><th class="num">This model</th><th class="num">Season average</th><th class="num">Last four games</th></tr></thead>
          <tbody>
            <tr><td>All players</td><td class="num big">1.91</td><td class="num mono">1.98</td><td class="num mono">1.95</td></tr>
            <tr><td>Likely starters</td><td class="num big">2.40</td><td class="num mono">2.45</td><td class="num mono">2.49</td></tr>
            <tr><td>Defenders</td><td class="num big">2.48</td><td class="num mono">2.56</td><td class="num mono">2.60</td></tr>
            <tr><td>Midfielders</td><td class="num big">2.31</td><td class="num mono">2.35</td><td class="num mono">2.42</td></tr>
          </tbody>
        </table></div>
        <p class="note" style="margin-top:10px">Read that honestly: the model beats doing nothing, but only by
          <strong>2&ndash;4%</strong>. Its real strength is calibration &mdash; it projects 2.20 points per player-gameweek
          against 2.18 actual, a bias of +0.015 &mdash; which is what makes projections safe to add up across a squad
          and a horizon. Picking the top 20 by projection returned 4.19 points a head against 4.00 for season average.</p>
        <p class="note">The one thing it clearly does not do is see hauls coming: performances that returned 10+ points
          were projected at 3.2. That is inherent &mdash; a projection is an average, and a player who averages 5 gets there
          by scoring 2 most weeks and 15 occasionally.</p>
        <p class="note">Captaincy is simply the highest projection. Doubling is linear, so maximising expected points means
          captaining the largest expected score &mdash; skew and variance do not change that. Over 30 backtested gameweeks the
          model's captain returned 4.83 against 5.57 for captaining the highest points-per-game player, but the two picked the
          <em>same player in 17 of those 30 weeks</em> and the gap is not statistically significant (t&nbsp;=&nbsp;&minus;1.33).
          Averaged over the top three picks, which is far less noisy, the model is ahead: 4.90 against 4.61.</p>
        <h3 style="font-size:16px;margin-top:18px">How far the market reaches, and why that is enough</h3>
        <p class="note">Polymarket prices roughly three gameweeks ahead, and liquidity falls off a cliff across them —
          millions on this weekend's matches, a few thousand and no actual trading three weeks out. So the long horizon
          is the model's own work.</p>
        <p class="note">That matters less than it sounds. Stripping <em>every</em> fixture input — opponent, home advantage,
          market odds — and giving all 132 likely starters an average opponent instead moves a 10-gameweek projection by
          <strong>2.7%</strong>, and leaves 48 of the top 50 players in the same order. At one gameweek the same test moves it
          <strong>11.7%</strong> and reorders the top 10. Fixture runs wash out: over ten games everyone plays a similar mix.</p>
        <p class="note">That average is the wrong number for a transfer decision, though, and it is worth being precise about why.
          The median player's fixture run is worth almost nothing, which drags the average down — but the spread is what you act on.
          Over five gameweeks the gap between the best and worst run is <strong>4.2 points for a defender</strong>, 2.6 for a
          midfielder and 2.1 for a forward. Among genuinely comparable players — same position, within £0.5m, similar underlying
          rates — the fixture run <strong>reverses which one is better in 10% of defender pairs</strong> and 7% of midfield pairs.</p>
        <p class="note">So: fixtures will not change who the best players in the game are, but they routinely decide which of two
          similar defenders you bring in. That is exactly the rotation call, and the <strong>Fixtures</strong> column on Best buys
          and the rotation tables on the ticker tab isolate it — the points coming from the run rather than the player.
          Re-run the underlying check with <span class="mono">NEUTRAL_FIXTURES=1 npm run model</span>.</p>
        <h3 style="font-size:16px;margin-top:18px">Known limits</h3>
        <p class="note">The largest one is worth stating plainly: expected minutes are the biggest lever on every projection,
          and there is no good free source for them. The strongest public models buy human-curated predicted line-ups or let
          the user set minutes by hand. This one infers them from history and price, which is decent for established starters
          and weak for everyone else — hence the overrides file.</p>
        <ul class="tight">
          <li>It does not read team news, press conferences or expected line-ups. A manager's Friday comment beats it every time.</li>
          <li>Early in a season it leans heavily on last year, so a player in a genuinely new role will be mispriced.</li>
          <li>Blank and double gameweeks are not modelled — the ticker shows fixtures as currently scheduled.</li>
          <li>Set-piece and penalty duty changes are not tracked, and they move projections a lot.</li>
        </ul>
        <h3 style="font-size:16px;margin-top:18px">Refreshing it</h3>
        <p class="note">Run <span class="mono">npm run refresh</span> in the project folder. It re-fetches the API,
          rebuilds the projections and regenerates this page. Data here was fetched ${esc(new Date(D.fetched).toUTCString())}.</p>
      </div>
    </section>`;
}

/* ------------------------------------------------------------------ boot */
const RENDER = { squad: renderSquad, next: renderNext, plan: renderPlan, transfers: renderTransfers, targets: renderTargets, value: renderValue, fixtures: renderFixtures, research: renderResearch, method: renderMethod };
let active = 'squad';
function show(name) {
  if (!RENDER[name]) name = 'squad';
  active = name;
  // replaceState throws on file:// URLs, where this page is perfectly usable.
  try { if (location.hash.slice(1) !== name) history.replaceState(null, '', '#' + name); } catch (e) {}
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.panel === name)));
  document.querySelectorAll('.panel').forEach(p => { p.hidden = p.id !== 'p-' + name; });
  RENDER[name]();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.panel));
document.addEventListener('click', e => {
  const th = e.target.closest('th.sortable[data-sort]');
  if (th) {
    const k = th.dataset.sort;
    squadSort = squadSort.key === k ? { key: k, dir: -squadSort.dir }
                                    : { key: k, dir: (k === 'name' || k === 'pos') ? 1 : -1 };
    RENDER[active]();
    return;
  }
  const btn = e.target.closest('#horizon button');
  if (!btn) return;
  H = +btn.dataset.h;
  RENDER[active]();
});
document.getElementById('entryName').textContent = `${D.entry.name} · ${D.entry.manager}`;
document.getElementById('stamp').textContent =
  `Gameweek ${D.nextGw} · squad as of GW${D.entry.squadGw ?? '–'} · data ${new Date(D.fetched).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}`;
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1) || 'squad');
</script>
